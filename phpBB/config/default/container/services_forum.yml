        arguments:
            - '@auth'
            - '@avatar.helper'
            - '@config'
            - '@content.visibility'
            - '@dbal.conn'
            - '@dispatcher'
            - '@profilefields.manager'
            - '@user'
            - '%tables.posts%'
            - '%tables.users%'
            - '%tables.zebra%'
            - '%tables.sessions%'
