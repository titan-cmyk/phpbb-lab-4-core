    forum.service.viewtopic_poll:
        class: phpbb\forum\service\viewtopic_poll
        arguments:
            - '@auth'
            - '@config'
            - '@dbal.conn'
            - '@dispatcher'
            - '@request'
            - '@template'
            - '@user'
            - '%core.root_path%'
            - '%core.php_ext%'

    forum.service.viewtopic_completion:
        class: phpbb\forum\service\viewtopic_completion
        arguments:
            - '@auth'
            - '@config'
            - '@dbal.conn'
            - '@dispatcher'
            - '@pagination'
            - '@request'
            - '@template'
            - '@user'
            - '%core.root_path%'
            - '%core.php_ext%'

    forum.service.viewtopic_handler:
        class: phpbb\forum\service\viewtopic_handler
        arguments:
            - '@auth'
            - '@config'
            - '@content.visibility'
            - '@dispatcher'
            - '@pagination'
            - '@request'
            - '@user'
            - '@forum.service.viewtopic_navigation'
            - '@forum.data.viewtopic_repository'
            - '@forum.service.viewtopic_page'
            - '@forum.service.viewtopic_poll'
