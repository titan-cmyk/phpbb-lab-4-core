services:
    phpbb.birthday.helper:
        class: phpbb\forum\birthday_helper
        arguments:
            - '@auth'
            - '@config'
            - '@dbal.conn'
            - '@dispatcher'
            - '@language'
            - '@template'
            - '@user'

    forum.helper:
        class: phpbb\forum\helper
        arguments:
            - '@config'
            - '@dbal.conn'
            - '@dispatcher'
            - '@user'
    forum.controller.index:
        class: phpbb\forum\controller\index
        arguments:
            - '@auth'
            - '@phpbb.birthday.helper'
            - '@config'
            - '@controller.helper'
            - '@dispatcher'
            - '@group_helper'
            - '@language'
            - '@user'
            - '@template'
            - '%core.root_path%'
            - '%core.php_ext%'

    forum.data.viewforum_repository:
        class: phpbb\forum\data\viewforum_repository
        arguments:
            - '@dbal.conn'
            - '@dispatcher'
            - '%tables.forums%'
            - '%tables.forums_track%'
            - '%tables.forums_watch%'

    forum.service.viewforum_topics:
        class: phpbb\forum\service\viewforum_topics
        arguments:
            - '@auth'
            - '@config'
            - '@content.visibility'
            - '@dbal.conn'
            - '@dispatcher'
            - '@pagination'
            - '@user'
            - '%tables.topics%'
            - '%tables.topics_posted%'
            - '%tables.topics_track%'
            - '%tables.forums%'
            - '%tables.forums_track%'


    forum.service.viewforum_topic_renderer:
        class: phpbb\forum\service\viewforum_topic_renderer
        arguments:
            - '@auth'
            - '@cache'
            - '@config'
            - '@content.visibility'
            - '@dispatcher'
            - '@pagination'
            - '@template'
            - '@user'
            - '%core.root_path%'
            - '%core.php_ext%'

    forum.service.viewforum_page:
        class: phpbb\forum\service\viewforum_page
        arguments:
            - '@auth'
            - '@config'
            - '@controller.helper'
            - '@content.visibility'
            - '@cron.manager'
            - '@dbal.conn'
            - '@dispatcher'
            - '@forum.data.viewforum_repository'
            - '@pagination'
            - '@request'
            - '@template'
            - '@user'
            - '%core.root_path%'
            - '%core.php_ext%'

    forum.service.viewforum_handler:
        class: phpbb\forum\service\viewforum_handler
        arguments:
            - '@auth'
            - '@config'
            - '@request'
            - '@user'
            - '@forum.data.viewforum_repository'
            - '@forum.service.viewforum_page'
            - '@forum.service.viewforum_topics'
            - '@forum.service.viewforum_topic_renderer'

    forum.controller.viewforum:
        class: phpbb\forum\controller\viewforum
        arguments:
            - '@forum.service.viewforum_handler'

    forum.data.viewtopic_repository:
        class: phpbb\forum\data\viewtopic_repository
        arguments:
            - '@dbal.conn'
            - '@content.visibility'
            - '%tables.forums%'
            - '%tables.posts%'
            - '%tables.topics%'
            - '%tables.topics_watch%'
            - '%tables.bookmarks%'
            - '%tables.topics_track%'
            - '%tables.forums_track%'

    forum.service.viewtopic_navigation:
        class: phpbb\forum\service\viewtopic_navigation
        arguments:
            - '@dbal.conn'
            - '@content.visibility'
            - '@user'
            - '%tables.topics%'
            - '%tables.posts%'
            - '%tables.forums%'

    forum.service.viewtopic_page:
        class: phpbb\forum\service\viewtopic_page
        arguments:
            - '@auth'
            - '@cache'
            - '@config'
            - '@content.visibility'
            - '@dbal.conn'
            - '@dispatcher'
            - '@pagination'
            - '@request'
            - '@template'
            - '@user'
